[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vajra-market-regime-engine"
version = "0.1.0"
description = "Point-in-time NSE OHLCV research, breadth, momentum-health and regime engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Sakil Beg"}]
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "PyYAML>=6.0,<7",
  "rich>=13.8,<15",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
vajra = "vajra_regime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vajra_regime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/vajra_regime/corporate_actions.py" = ["SIM108"]
"src/vajra_regime/rolling_master.py" = ["F841"]
# These modules contain long, auditable research/SQL/model statements. Keeping formulas intact
# is clearer than wrapping expressions solely for Python E501.
"src/vajra_regime/monthly_universe.py" = ["E501"]
